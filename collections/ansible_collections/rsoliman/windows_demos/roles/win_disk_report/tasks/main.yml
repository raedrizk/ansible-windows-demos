---
- name: Gather disk facts
  community.windows.win_disk_facts:

- name: Set volume usage facts
  ansible.builtin.set_fact:
    volume_usage: >-
      {{
        volume_usage | default([]) + [{
          'drive_letter': item.drive_letter,
          'label': (item.volumes | first).label | default(''),
          'total_size': (item.volumes | first).size | filesizeformat,
          'free_size': (item.volumes | first).size_remaining | filesizeformat,
          'percent_used': (((item.volumes | first).size - (item.volumes | first).size_remaining) / (item.volumes | first).size * 100) | round(1)
        }]
      }}
  loop: >-
    {{
      ansible_facts.disks
      | map(attribute='partitions')
      | flatten
      | selectattr('drive_letter', 'defined')
      | selectattr('drive_letter', 'ne', '')
      | list
    }}
  loop_control:
    label: "{{ item.drive_letter }}"
  when: item.volumes | default([]) | length > 0

- name: Print disk usage report
  ansible.builtin.debug:
    msg: >-
      Drive {{ item.drive_letter }}:
      {{ item.label }}
      - Total: {{ item.total_size }}
      - Free: {{ item.free_size }}
      - Used: {{ item.percent_used }}%
  loop: "{{ volume_usage }}"
  loop_control:
    label: "{{ item.drive_letter }}"

- name: Set stats for disk usage
  ansible.builtin.set_stats:
    data:
      disk_usage: "{{ volume_usage }}"
    per_host: true
